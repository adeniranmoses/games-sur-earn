<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="coinGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="coinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Base Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#07090E" />

  <!-- Neon Glowing Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#brandGrad)" stroke-width="3" />

  <!-- Secondary Back Coin -->
  <circle cx="37" cy="25" r="14" fill="#0E121B" stroke="url(#coinGrad1)" stroke-width="2.5" />
  <!-- Coin 1 numeral -->
  <path d="M35.5 21.5 L37.5 19.5 L37.5 29.5" fill="none" stroke="#A5B4FC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M34.5 29.5 L40.5 29.5" fill="none" stroke="#A5B4FC" stroke-width="2.2" stroke-linecap="round" />

  <!-- Primary Front Coin (overlapping) -->
  <circle cx="27" cy="38" r="15" fill="#07090E" stroke="url(#brandGrad)" stroke-width="2.8" />
  <!-- Coin 1 numeral -->
  <path d="M25.5 34 L27.5 32 L27.5 43" fill="none" stroke="#818CF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M24 43 L31 43" fill="none" stroke="#818CF8" stroke-width="2.4" stroke-linecap="round" />
</svg>
